---
deployment:
  tasks:
    # Live Laravel app root (vendor/ and .env already live here).
    - export DEPLOYPATH=/home/prestig5/public_html
    # Copy code from the repo into the live site. vendor/, node_modules/, .env
    # and the storage/ runtime are NOT in the repo, so they are left untouched.
    - /bin/cp -R app $DEPLOYPATH
    - /bin/cp -R bootstrap $DEPLOYPATH
    - /bin/cp -R config $DEPLOYPATH
    - /bin/cp -R database $DEPLOYPATH
    - /bin/cp -R public $DEPLOYPATH
    - /bin/cp -R resources $DEPLOYPATH
    - /bin/cp -R routes $DEPLOYPATH
    - /bin/cp -f artisan $DEPLOYPATH
    - /bin/cp -f composer.json $DEPLOYPATH
    - /bin/cp -f composer.lock $DEPLOYPATH
    - /bin/cp -f package.json $DEPLOYPATH
    - /bin/cp -f vite.config.js $DEPLOYPATH
    # Clear Laravel's cached config/routes and compiled Blade views so every
    # change (routes, config, templates) takes effect immediately after a pull.
    - /bin/rm -f $DEPLOYPATH/bootstrap/cache/config.php
    - /bin/rm -f $DEPLOYPATH/bootstrap/cache/routes-v7.php
    - /bin/rm -rf $DEPLOYPATH/storage/framework/views/*.php
    # Record each deploy so you can confirm it ran.
    - /bin/echo "Deployed on $(date)" >> $DEPLOYPATH/storage/logs/deploy.log
